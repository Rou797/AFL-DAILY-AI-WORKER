name: AFL Daily Worker Setup

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract worker
        run: unzip -o AFL-Daily-AI-Worker-One-Tap-Upgrade.zip

      - name: Save worker files
        run: |
          git config user.name "AFL Daily Worker"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Install AFL Daily Worker" || true
          git push
